# Simulátor FVE pro ladění FVE Optimizeru bez skutečného hardwaru.
#
# Chová se jako Growatt SPH s omezeným přetokem:
#   * FV výroba je oříznutá na spotřebu + nabíjení baterie + limit přetoku
#     (limit v % z 10 kW, jako u Growattu),
#     takže při plné baterii a limitu 0 je přebytek "neviditelný".
#   * Baterie 10 kWh, max. 10 kW nabíjení/vybíjení, vybíjí se do 10 %.
#   * Bojler 2 kW (L1) s vlastním termostatem na 80 °C, 160 l.
#   * EcoVolter: proud 6–16 A, 1/3 fáze.
#
# Ovládáš "sim_*" posuvníky (dostupná FV výroba, spotřeba domu, …).
# Integrace ovládá spínač bojleru, nabíjení, fáze, proud a limit přetoku.
#
# Znaménka: síť kladná = odběr, baterie kladná = nabíjení.

input_number:
  # --- to, co nastavuješ ty -------------------------------------------------
  sim_pv_available:
    name: "Sim: dostupná FV výroba"
    min: 0
    max: 10000
    step: 100
    unit_of_measurement: W
    initial: 6000
  sim_house_load:
    name: "Sim: spotřeba domu"
    min: 0
    max: 8000
    step: 50
    unit_of_measurement: W
    initial: 500
  sim_forecast_remaining:
    name: "Sim: zbývající predikce dnes"
    min: 0
    max: 80
    step: 0.5
    unit_of_measurement: kWh
    initial: 20
  sim_speed:
    name: "Sim: zrychlení času (SoC, teplota)"
    min: 1
    max: 200
    step: 1
    initial: 20
  # --- stav, který simulátor sám mění (jde i ručně; přežije restart) --------
  sim_battery_soc:
    name: "Sim: SoC baterie"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
  sim_water_temp:
    name: "Sim: teplota vody"
    min: 5
    max: 95
    step: 0.1
    unit_of_measurement: "°C"
  # --- to, co ovládá integrace -----------------------------------------------
  # V % výkonu střídače (10 kW), stejně jako Growatt.
  sim_export_limit:
    name: "Sim: limit přetoku"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
  sim_ev_current:
    name: "Sim: EV nabíjecí proud"
    min: 6
    max: 16
    step: 1
    unit_of_measurement: A
    initial: 6

input_boolean:
  sim_boiler:
    name: "Sim: bojler (relé)"
  sim_ev_charge:
    name: "Sim: EV nabíjení"
  sim_ev_3phase:
    name: "Sim: EV 3 fáze"
    initial: true
  sim_ev_connected:
    name: "Sim: auto připojeno"
    initial: true
  sim_hdo:
    name: "Sim: HDO (nízký tarif)"

template:
  - binary_sensor:
      - name: "Sim EV connected"
        unique_id: sim_ev_connected
        device_class: plug
        state: "{{ is_state('input_boolean.sim_ev_connected', 'on') }}"

  - sensor:
      - name: "Sim boiler power"
        unique_id: sim_boiler_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {{ 2000 if is_state('input_boolean.sim_boiler', 'on')
             and states('input_number.sim_water_temp') | float(0) < 80 else 0 }}

      - name: "Sim EV power"
        unique_id: sim_ev_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('input_boolean.sim_ev_charge', 'on')
                and is_state('input_boolean.sim_ev_connected', 'on') %}
            {{ (states('input_number.sim_ev_current') | float(0) * 230
                * (3 if is_state('input_boolean.sim_ev_3phase', 'on') else 1)) | round(0) }}
          {% else %}0{% endif %}

      - name: "Sim load"
        unique_id: sim_load
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {{ states('input_number.sim_house_load') | float(0)
             + states('sensor.sim_boiler_power') | float(0)
             + states('sensor.sim_ev_power') | float(0) }}

      # Výroba oříznutá střídačem (omezení přetoku a plná baterie).
      - name: "Sim PV power"
        unique_id: sim_pv_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set room = 10000 if states('input_number.sim_battery_soc') | float(0) < 100 else 0 %}
          {{ [states('input_number.sim_pv_available') | float(0),
              states('sensor.sim_load') | float(0) + room
              + states('input_number.sim_export_limit') | float(0) * 100] | min }}

      - name: "Sim battery power"
        unique_id: sim_battery_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set soc = states('input_number.sim_battery_soc') | float(0) %}
          {% set surplus = states('sensor.sim_pv_power') | float(0) - states('sensor.sim_load') | float(0) %}
          {% if surplus > 0 %}
            {{ [surplus, 10000 if soc < 100 else 0] | min }}
          {% elif soc > 10 %}
            {{ [surplus, -10000] | max }}
          {% else %}0{% endif %}

      - name: "Sim grid power"
        unique_id: sim_grid_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.sim_load') | float(0) - states('sensor.sim_pv_power') | float(0)
              + states('sensor.sim_battery_power') | float(0)) | round(0) }}

      - name: "Sim battery SoC"
        unique_id: sim_battery_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: "{{ states('input_number.sim_battery_soc') | float(0) | round(1) }}"

      - name: "Sim water temperature"
        unique_id: sim_water_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ states('input_number.sim_water_temp') | float(0) | round(1) }}"

      - name: "Sim forecast remaining today"
        unique_id: sim_forecast_remaining
        unit_of_measurement: kWh
        device_class: energy
        state: "{{ states('input_number.sim_forecast_remaining') | float(0) }}"

      # Proudy fází: dům rovnoměrně, bojler na L1, EV na L1 (1f) nebo všech (3f).
      - name: "Sim current L1"
        unique_id: sim_current_l1
        unit_of_measurement: A
        device_class: current
        state: >
          {% set three = is_state('input_boolean.sim_ev_3phase', 'on') %}
          {% set ev = states('sensor.sim_ev_power') | float(0) / 230 / (3 if three else 1) %}
          {{ (states('input_number.sim_house_load') | float(0) / 690
              + states('sensor.sim_boiler_power') | float(0) / 230 + ev) | round(1) }}
      - name: "Sim current L2"
        unique_id: sim_current_l2
        unit_of_measurement: A
        device_class: current
        state: >
          {% set three = is_state('input_boolean.sim_ev_3phase', 'on') %}
          {% set ev = states('sensor.sim_ev_power') | float(0) / 690 if three else 0 %}
          {{ (states('input_number.sim_house_load') | float(0) / 690 + ev) | round(1) }}
      - name: "Sim current L3"
        unique_id: sim_current_l3
        unit_of_measurement: A
        device_class: current
        state: >
          {% set three = is_state('input_boolean.sim_ev_3phase', 'on') %}
          {% set ev = states('sensor.sim_ev_power') | float(0) / 690 if three else 0 %}
          {{ (states('input_number.sim_house_load') | float(0) / 690 + ev) | round(1) }}

automation:
  # Každých 10 s posune SoC baterie a teplotu vody (× zrychlení času).
  - id: sim_tick
    alias: "Simulátor: krok"
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/10"
    actions:
      - variables:
          k: "{{ states('input_number.sim_speed') | float(1) }}"
          hours: "{{ 10 * k / 3600 }}"
          soc: "{{ states('input_number.sim_battery_soc') | float(0) }}"
          batt_w: "{{ states('sensor.sim_battery_power') | float(0) }}"
          temp: "{{ states('input_number.sim_water_temp') | float(0) }}"
          boiler_w: "{{ states('sensor.sim_boiler_power') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sim_battery_soc
        data:
          # 10 kWh baterie
          value: "{{ ([[soc + batt_w * hours / 10000 * 100, 0] | max, 100] | min) | round(1) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.sim_water_temp
        data:
          # 160 l × 1,163 Wh/(l·K); ztráty 0,5 K/h
          value: "{{ ([temp + (boiler_w / (160 * 1.163) - 0.5) * hours, 5] | max) | round(2) }}"
      # Jako Modbus: hodnoty se hlásí při každém dotazu, i když se nemění
      # (jinak by je pojistka FVE Optimizeru brala jako zamrzlé).
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.sim_grid_power
            - sensor.sim_battery_power
            - sensor.sim_battery_soc
            - sensor.sim_pv_power
            - sensor.sim_load
